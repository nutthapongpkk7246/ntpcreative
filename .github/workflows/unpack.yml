name: Restore NTP Creative Website

on:
  workflow_dispatch:
  push:
    paths:
      - "NTP_Creative_GitHub_Ready.zip"

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Restore website structure
        run: |
          ZIP="NTP_Creative_GitHub_Ready.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ZIP already processed."
            exit 0
          fi

          mkdir -p /tmp/ntp
          unzip -q "$ZIP" -d /tmp/ntp

          find . -mindepth 1 -maxdepth 1 \
            ! -name ".git" \
            ! -name ".github" \
            ! -name "$ZIP" \
            -exec rm -rf {} +

          cp -a /tmp/ntp/. .
          rm -f "$ZIP"

      - name: Save corrected files
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Restore NTP Creative site structure"
          git push
